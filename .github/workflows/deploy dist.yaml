name: Deploy Dist
on: 
   push:
    branches:
      - main
    paths-ignore:
      - 'github/workflows/**'
   workflow_dispatch:
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4
            - name: install node js
              uses:  actions/setup-node@v6
              with:
                node-version: 22
            - name: Cache dependencies
              uses: actions/cache@v5
              id: cache
              with:
                path: node_modules
                key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependancies 
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm install
            - name: Run Tests
              run: npm run test
    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4
            - name: install node js
              uses:  actions/setup-node@v6
              with:
                node-version: 22
            - name: Cache dependencies
              uses: actions/cache@v5
              id: cache
              with:
                 path: node_modules
                 key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependancies 
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm install
            - name: Run Build
              run: npm run build
            - name: upload dist artifact
              uses: actions/upload-pages-artifact@v4
              with:
                name: github-pages
                path: dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
               contents: read
               pages: write
               id-token: write
        environment:
               name: github-pages
               url: ${{steps.deployment.outputs.page_url}}
        steps:
          - name: Deploy artifact
            id: deployment
            uses: actions/deploy-pages@v4
            with:
              token: ${{secrets.GITHUB_TOKEN}}
